[project]
name = "aijournal"
version = "0.2.0"
description = "Local-first, YAML-centric personal self-modeling agent"
readme = "README.md"
authors = [
    { name = "Bas Nijholt", email = "bas@nijho.lt" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.3",
    "httpx>=0.28.1",
    "fastapi>=0.115.0",
    "orjson>=3.10.4",
    "pydantic>=2.12.3",
    "python-dateutil>=2.9.0.post0",
    "numpy",
    "pyyaml>=6.0.3",
    "typer>=0.20.0",
    "pydantic-ai>=1.6.0",
    "uvicorn>=0.30.6",
    "versioningit>=0.4.0",
]

[project.scripts]
aijournal = "aijournal.cli:app"
aij = "aijournal.cli:app"

[build-system]
requires = ["hatchling", "versioningit>=0.4.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.142.3",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
    "types-python-dateutil>=2.9.0.20251008",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501", # Line too long
]

[tool.mypy]
python_version = "3.12"
show_error_codes = true
strict = false
packages = ["aijournal"]

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.targets.wheel]
packages = ["aijournal"]

[tool.hatch.build.hooks.versioningit-onbuild]
build-file = "src/aijournal/_version.py"
source-file = "src/aijournal/_version.py"

[tool.versioningit]
default-version = "0.0.0"

[tool.versioningit.vcs]
method = "git"
match = ["v*"]
default-tag = "0.0.0"

[tool.versioningit.format]
dirty = "{version}.dev{distance}+{branch}.{vcs}{rev}.dirty"
distance = "{version}.dev{distance}+{branch}.{vcs}{rev}"
distance-dirty = "{version}.dev{distance}+{branch}.{vcs}{rev}.dirty"
