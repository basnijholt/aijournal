[project]
name = "aijournal"
version = "0.1.0"
description = "Local-first, YAML-centric personal self-modeling agent"
readme = "README.md"
authors = [
    { name = "Bas Nijholt", email = "bas@nijho.lt" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "cattrs>=25.3.0",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "typer>=0.20.0",
]

[project.scripts]
aijournal = "aijournal.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.142.3",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
    "types-python-dateutil>=2.9.0.20251008",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
show_error_codes = true
strict = false
packages = ["aijournal"]
